name: ReSukiSU OP13 Build (Enhanced)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-6.6.139
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  KERNEL_NAME: 'android15-8-g29d86c5fc9dd-abogki428889875-4k'
  CCACHE_KEY: ccache-neov4-6.6.139-${{ github.event.inputs.droidspaces_enable }}

on:
  workflow_dispatch:
    inputs:
      # ===== 核心功能开关 =====
      SUSFS:
        description: 'Enable SuSFS (hide environment)'
        required: true
        type: boolean
        default: true
      bbr_enable:
        description: "TCP BBR/Brutal: false=off, true=add, default=set as default"
        required: true
        type: choice
        default: 'true'
        options: ['false', 'true', 'default']
      lto_type:
        description: 'LTO optimization (none=fast, thin=default, full=slow)'
        required: true
        type: choice
        default: 'thin'
        options: ['none', 'thin', 'full']
      lz4_opt:
        description: 'LZ4/ZSTD options: none, lz4 (1.10.0), lz4kd, both'
        required: true
        type: choice
        default: 'lz4'
        options: ['none', 'lz4', 'lz4kd', 'both']
      adios_opt:
        description: 'ADIOS IO scheduler: off, simple (config only), full (apply patch)'
        required: true
        type: choice
        default: 'simple'
        options: ['off', 'simple', 'full']
      rekernel_enable:
        description: 'Re-Kernel (enhance app freezing via NoActive/Freezer)'
        required: true
        type: boolean
        default: false
      bbg_opt:
        description: 'Baseband Guard: off, cctv18 (source), vc-teahouse (source)'
        required: true
        type: choice
        default: 'cctv18'
        options: ['off', 'cctv18', 'vc-teahouse']
      unicode_fix:
        description: 'Unicode bypass fix (path traversal protection)'
        required: true
        type: boolean
        default: true
      zram_writeback:
        description: 'ZRAM writeback (better memory management)'
        required: true
        type: boolean
        default: false
      schedutil_opt:
        description: 'SchedUtil governor optimizations'
        required: true
        type: boolean
        default: false
      cpu_opt:
        description: 'CPU optimizations (Oryon SM8750 tuning)'
        required: true
        type: boolean
        default: true
      f2fs_opt:
        description: 'F2FS optimizations (flash storage performance)'
        required: true
        type: boolean
        default: false
      wireguard:
        description: 'WireGuard VPN support'
        required: true
        type: boolean
        default: true
      wakelock_blocker:
        description: 'Wakelock blocker (reduce idle drain)'
        required: true
        type: boolean
        default: true
      github_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true
      droidspaces_enable:
        description: 'Droidspaces container: off, standard (incl. NTSync), extend (extra drivers)'
        required: true
        type: choice
        default: 'standard'
        options: ['off', 'standard', 'extend']
      mem_opt_patches:
        description: 'Memory & scheduler optimization patches (from WildKernels)'
        required: true
        type: boolean
        default: true
      enable_scx:
        description: 'Enable SCX/HMBIRD (Fengchi) scheduler'
        required: true
        type: boolean
        default: false
      better_net:
        description: 'Network enhancements: IP_SET + IPv6 NAT + TTL'
        required: true
        type: boolean
        default: false
      version_tag:
        description: 'Custom version tag for KernelSU display (e.g. mybuild)'
        required: false
        type: string
        default: 'palaziks'
      kernel_suffix:
        description: 'Kernel suffix (do NOT start with hyphen, e.g. mykernel)'
        required: false
        type: string
        default: ''
      abk_modules:
        description: 'ABK external modules (format: url;stage, multiple with |, #branch)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cache Clang
        id: clang-cache
        uses: actions/cache@v5
        with:
          path: kernel_workspace/clang-r563880c
          key: Linux-aosp-clang-clang-r563880c

      - name: Cache build-tools
        id: buildtools-cache
        uses: actions/cache@v5
        with:
          path: kernel_workspace/build-tools
          key: codelinaro-build-tools-ks-kernel-lnx-4.0

      - name: Install dependencies & Init Source
        run: |
          echo "Relocating heavy folders for background deletion..."
          sudo mv /usr/share/dotnet /usr/share/dotnet_trash 2>/dev/null || true
          sudo mv /usr/local/lib/android /usr/local/lib/android_trash 2>/dev/null || true
          sudo mv /opt/ghc /opt/ghc_trash 2>/dev/null || true
          sudo mv /usr/lib/jvm /usr/lib/jvm_trash 2>/dev/null || true
          (sudo nice -n 19 ionice -c 3 rm -rf /usr/share/dotnet_trash /usr/local/lib/android_trash /opt/ghc_trash /usr/lib/jvm_trash) &

          rm -rf kernel_workspace/common kernel_workspace/out 2>/dev/null || true
          mkdir -p kernel_workspace/clang-r563880c kernel_workspace/build-tools
          cd kernel_workspace

          sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=0 \
            libelf-dev dos2unix pahole cmake &

          echo "Cloning source repository..."
          curl -L https://github.com/palazik/android_kernel_common_oneplus_sm8750/archive/refs/heads/6.6.139_oneplus13_coloros16.zip \
            -o common.zip &&
          unzip -q common.zip &&
          mv android_kernel_common_oneplus_sm8750-* common &&
          rm -f common.zip &

          if [ "${{ steps.clang-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss — downloading Clang ..."
            mkdir -p clang-r563880c
            aria2c -x16 -s16 -k1M -j16 --retry-wait=5 --max-tries=10 \
              -d /dev/shm -o clang-r563880c.tar.gz \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r563880c.tar.gz"
            tar -C clang-r563880c -zxf /dev/shm/clang-r563880c.tar.gz
            rm -f /dev/shm/clang-r563880c.tar.gz
          else
            echo "Clang restored from cache, skipping download."
          fi &

          if [ "${{ steps.buildtools-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss — cloning build-tools..."
            git clone --depth=1 -b ks-kernel.lnx.4.0.r1-rel \
              https://git.codelinaro.org/clo/la/kernel/prebuilts/build-tools.git build-tools
          else
            echo "build-tools restored from cache, skipping clone."
          fi &

          wait

          echo "Removing ABI protection & dirty suffix..."
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

          echo "Source and tools initialized successfully!"

      - name: Cache ccache-ECS binary
        uses: actions/cache@v5
        id: ecs-cache
        with:
          path: /tmp/ccache-ecs-bin
          key: ccache-ecs-${{ runner.os }}-084a7620

      - name: Build & Install ccache-ECS
        run: |
          if [ -f /tmp/ccache-ecs-bin/ccache ]; then
            echo "ECS binary cached, skipping build"
            sudo cp /tmp/ccache-ecs-bin/ccache /usr/local/bin/ccache
          else
            sudo apt-get install -y --no-install-recommends cmake
            git clone --depth=1 https://github.com/cctv18/ccache-ECS.git /tmp/ccache-ecs
            cd /tmp/ccache-ecs
            ./ci/build-binary
            mkdir -p /tmp/ccache-ecs-bin
            cp install/ccache /tmp/ccache-ecs-bin/ccache
            sudo cp /tmp/ccache-ecs-bin/ccache /usr/local/bin/ccache
          fi
          sudo chmod 755 /usr/local/bin/ccache
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "✅ ECS ccache: $(/usr/local/bin/ccache --version | head -1)"

      - name: Save ccache-ECS binary cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: /tmp/ccache-ecs-bin
          key: ccache-ecs-${{ runner.os }}-084a7620

      - name: Configure CCache Directory
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_6.6.139" >> $GITHUB_ENV
          echo "LDCACHE_DIR=/dev/shm/ldcache_6.6.139" >> $GITHUB_ENV
          mkdir -p /dev/shm/ldcache_6.6.139
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
          echo "Current Disk Space:"
          df -h
          echo "Current Build Kernel Version: 6.6.139"

      - name: Restore CCache
        uses: actions/cache/restore@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_KEY }}-

      - name: Restore LTO Cache
        uses: actions/cache/restore@v5
        if: inputs.lto_type == 'thin'
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: lto-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            lto-cache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Pull Public CCache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking local cache status..."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "Local cache loaded successfully, skipping public cache pull!"
            exit 0
          fi
          
          echo "Cache miss, attempting to pull public ccache..."
          mkdir -p ${{ env.CCACHE_DIR }}
          FILE_NAME="ccache-6.6.139.tar.zst"
          
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "Successfully downloaded $FILE_NAME, extracting..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "Public ccache restored successfully!"
          else
            echo "Public ccache not found, proceeding with full clean build..."
          fi
      
      - name: Init and Config CCache
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          mkdir -p "$CCACHE_DIR"

          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression=true
          ccache -o compiler_check=none
          ccache -o hash_dir=false
          ccache -o direct_mode=true
          ccache -o depend_mode=false
          ccache -o base_dir="${{ github.workspace }}"
          ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros,locale

          echo "Initial CCache status:"
          ccache -s

          echo "Updating atime to achieve cache eviction..."
          find "${{ env.CCACHE_DIR }}" -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} + || true

      # ===== 安装 ReSukiSU（固定）并注入自定义版本标签 =====
      - name: Setup ReSukiSU
        id: ksu_version
        run: |
          cd kernel_workspace/common
          echo "Setting up ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main

          cd KernelSU
          git reset --hard HEAD && git clean -fd
          KSU_VERSION_COUNT=$(git rev-list --count HEAD)
          KSUVER=$(expr $KSU_VERSION_COUNT + 30700)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          echo "ksuver=$KSUVER" >> $GITHUB_OUTPUT

          # 注入自定义版本字符串
          KBUILD_FILE="kernel/Kbuild"
          if [ -f "$KBUILD_FILE" ]; then
            sed -i '/-DKSU_VERSION_FULL=/d' "$KBUILD_FILE"
            TAG="${{ github.event.inputs.version_tag }}"
            [ -z "$TAG" ] && TAG="palaziks"
            REAL_TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
            REAL_COMMIT=$(git rev-parse --short HEAD)
            echo "ccflags-y += -DKSU_VERSION_FULL=\\\"v${REAL_TAG}-${REAL_COMMIT}@${TAG}\\\"" >> "$KBUILD_FILE"
          fi
          cd ../..

      # ===== 补丁应用（整合所有特性） =====
      - name: Setup Patches
        run: |
          cd kernel_workspace

          echo "Cloning required patch repos..."
          if [ "${{ github.event.inputs.SUSFS }}" == "true" ]; then         
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git -b oki-android15-6.6 &
          fi
          git clone --depth=1 https://github.com/mrcxlinux/kernel_patches.git &
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU_Patches.git &
          git clone --depth=1 https://github.com/TheWildJames/kernel_patches.git wildkernels_patches &
          wait

          cd ./common

          # ---- SUSFS ----
          if [ "${{ github.event.inputs.SUSFS }}" == "true" ]; then
            cp ../susfs4oki/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./
            cp ../susfs4oki/kernel_patches/fs/* ./fs/
            cp ../susfs4oki/kernel_patches/include/linux/* ./include/linux/
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/69_hide_stuff.patch -O 69_hide_stuff.patch 2>/dev/null || true
            patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch || true
            patch -p1 -N -F 3 < 69_hide_stuff.patch || true
            # task_mmu.c 特殊处理（原配置1逻辑）
            sed -i '/#define SENTINEL_VMA_GATE/a #include <linux/susfs.h>' fs/proc/task_mmu.c
            awk '
            /smap_gather_stats\(vma, &mss, last_vma_end\);/ {
                print "#ifdef CONFIG_KSU_SUSFS_SUS_MAP"
                print "\t\t\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))) {"
                print "\t\t\t\tcontinue;"
                print "\t\t\t}"
                print "#endif"
            }
            { print }
            ' fs/proc/task_mmu.c > fs/proc/task_mmu.c.tmp && mv fs/proc/task_mmu.c.tmp fs/proc/task_mmu.c
          fi

          # ---- POLLY ----
          cp ../kernel_patches/common/EnablePOLLY.patch ./
          git apply -p1 < EnablePOLLY.patch || true

          # ---- LZ4 和 LZ4KD（根据 lz4_opt） ----
          LZ4_OPT="${{ github.event.inputs.lz4_opt }}"
          if [ "$LZ4_OPT" = "lz4" ] || [ "$LZ4_OPT" = "both" ]; then
            echo "Applying LZ4 1.10.0 + ZSTD 1.5.7..."
            git clone --depth=1 https://github.com/$GITHUB_REPOSITORY.git -b $GITHUB_REF_NAME $GITHUB_ACTOR
            cp ./$GITHUB_ACTOR/zram_patch/001-lz4.patch ./
            cp ./$GITHUB_ACTOR/zram_patch/lz4armv8.S ./lib/
            cp ./$GITHUB_ACTOR/zram_patch/002-zstd.patch ./
            git apply -p1 < 001-lz4.patch || true
            patch -p1 < 002-zstd.patch || true
          fi
          if [ "$LZ4_OPT" = "lz4kd" ] || [ "$LZ4_OPT" = "both" ]; then
            echo "Applying LZ4KD patch..."
            git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git /tmp/sukisu_patch
            cp -r /tmp/sukisu_patch/other/zram/lz4k/include/linux/* ./include/linux/
            cp -r /tmp/sukisu_patch/other/zram/lz4k/lib/* ./lib
            cp -r /tmp/sukisu_patch/other/zram/lz4k/crypto/* ./crypto
            cp /tmp/sukisu_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
            patch -p1 -F 3 < lz4kd.patch || true
          fi

          # ---- ADIOS full ----
          ADIOS_OPT="${{ github.event.inputs.adios_opt }}"
          if [ "$ADIOS_OPT" = "full" ]; then
            echo "Applying ADIOS full patch..."
            PATCH_URL="https://raw.githubusercontent.com/qdykernel/Build_Oneplus_Realme_Action/main/patch/adios_ioscheduler_6.6.patch"
            wget -O adios.patch "$PATCH_URL" 2>/dev/null || true
            if [ -f adios.patch ]; then
              patch -p1 --ignore-whitespace -F 3 < adios.patch || true
            fi
          fi

          # ---- SCX / 风驰（智能检测） ----
          if [ "${{ github.event.inputs.enable_scx }}" == "true" ]; then
            echo "Processing SCX/HMBIRD optimization..."
            if [ -d "kernel/sched/hmbird" ] && grep -q "CONFIG_HMBIRD_SCHED=y" arch/arm64/configs/gki_defconfig; then
              echo "SCX already present, skipping."
            else
              git clone --depth=1 https://github.com/Numbersf/SCHED_PATCH.git -b sm8750 /tmp/scx
              PATCH_FILE="/tmp/scx/fengchi_oneplus_13_b.patch"
              if [ -f "$PATCH_FILE" ]; then
                dos2unix "$PATCH_FILE"
                patch -p1 -F 3 < "$PATCH_FILE" || true
                echo "SCX patch applied."
              else
                echo "SCX patch not found, skipping."
              fi
            fi
          fi

          # ---- Droidspaces (standard/extend) ----
          DROID_MODE="${{ github.event.inputs.droidspaces_enable }}"
          if [ "$DROID_MODE" != "off" ]; then
            echo "Applying Droidspaces patches ($DROID_MODE)..."
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch -O fix_sysvipc.patch 2>/dev/null || true
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch -O fix_midas.patch 2>/dev/null || true
            patch -p1 -F 3 < fix_sysvipc.patch || true
            patch -p1 -F 3 < fix_midas.patch || true
            # NTSync (standard 或 extend 均启用)
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_base.patch -O ntsync_base.patch 2>/dev/null || true
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_android15-6.6.patch -O ntsync_compat.patch 2>/dev/null || true
            patch -p1 -F 3 < ntsync_base.patch || true
            patch -p1 -F 3 < ntsync_compat.patch || true
            if [ "$DROID_MODE" = "extend" ]; then
              wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/evdi_drm.patch -O evdi.patch 2>/dev/null || true
              patch -p1 -F 3 < evdi.patch || true
            fi
          fi

          # ---- 网络增强 better_net ----
          if [ "${{ github.event.inputs.better_net }}" == "true" ]; then
            echo "Enabling better_net (IP_SET + IPv6 NAT + TTL)..."
            # IPv6 NAT fix
            if [ -f "../wildkernels_patches/common/IPv6_NAT_FIX.patch" ]; then
              patch -p1 -F 3 < ../wildkernels_patches/common/IPv6_NAT_FIX.patch || true
            fi
            # 隐藏 vintf 警告
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/config.patch -O config.patch 2>/dev/null || true
            patch -p1 -F 3 < config.patch || true
          fi

          # ---- Unicode bypass（使用配置2方式） ----
          if [ "${{ github.event.inputs.unicode_fix }}" == "true" ]; then
            echo "Applying Unicode bypass fix..."
            KERNEL_MAJOR=$(grep -Po '^VERSION = \K[0-9]+' Makefile || echo 6)
            if [ "$KERNEL_MAJOR" -lt 6 ]; then
              PATCH_URL="https://raw.githubusercontent.com/Numbersf/Action-Build/ReSukiSU/patches/unicode_bypass_fix_6.1-.patch"
            else
              PATCH_URL="https://raw.githubusercontent.com/Numbersf/Action-Build/ReSukiSU/patches/unicode_bypass_fix_6.1+.patch"
            fi
            wget -O unicode_bypass.patch "$PATCH_URL" 2>/dev/null || true
            patch -p1 --forward < unicode_bypass.patch || true
          fi

          # ---- 内存优化补丁（原配置1） ----
          if [ "${{ github.event.inputs.mem_opt_patches }}" == "true" ]; then
            echo "Applying WildKernels memory/scheduler patches..."
            PATCHES_DIR="../wildkernels_patches/common"
            for p in optimized_mem_operations.patch file_struct_8bytes_align.patch reduce_cache_pressure.patch mem_opt_prefetch.patch optimise_memcmp.patch minimise_wakeup_time.patch int_sqrt.patch force_tcp_nodelay.patch reduce_gc_thread_sleep_time.patch add_timeout_wakelocks_globally.patch f2fs_reduce_congestion.patch reduce_freeze_timeout.patch clear_page_16bytes_align.patch add_limitation_scaling_min_freq.patch re_write_limitation_scaling_min_freq.patch adjust_cpu_scan_order.patch avoid_extra_s2idle_wake_attempts.patch disable_cache_hot_buddy.patch f2fs_enlarge_min_fsync_blocks.patch increase_ext4_default_commit_age.patch increase_sk_mem_packets.patch reduce_pci_pme_wakeups.patch silence_irq_cpu_logspam.patch silence_system_logspam.patch use_unlikely_wrap_cpufreq.patch; do
              if [ -f "$PATCHES_DIR/$p" ]; then
                patch -p1 --forward < "$PATCHES_DIR/$p" || true
              fi
            done
          fi

          echo "All patches applied."

      # ---- 修复 SUSFS 符号链接（同原配置1） ----
      - name: Fix SUSFS selinux symbol linkage
        if: github.event.inputs.SUSFS == 'true'
        working-directory: kernel_workspace/common
        run: |
          SERVICES="security/selinux/ss/services.c"
          RULES="KernelSU/kernel/selinux/rules.c"
          sed -i '/^#define ALL NULL/a\\n#ifdef CONFIG_KSU_SUSFS\nstruct selinux_policy *backup_sepolicy;\n#endif' "$RULES"
          sed -i '/rcu_assign_pointer(selinux_state.policy, pol);/a#ifdef CONFIG_KSU_SUSFS\n    backup_sepolicy = pol;\n#endif' "$RULES"

      - name: Fix missing KSU static key symbols (SUSFS=false)
        if: github.event.inputs.SUSFS != 'true'
        working-directory: kernel_workspace/common
        run: |
          KSUD=$(find . -name "ksud.c" | head -1)
          if [ -z "$KSUD" ]; then
            echo "ksud.c not found, skipping"
            exit 0
          fi
          sed -i \
            's|extern struct static_key_false ksu_input_hook_key_false;|struct static_key_false ksu_input_hook_key_false = STATIC_KEY_FALSE_INIT;\nEXPORT_SYMBOL_GPL(ksu_input_hook_key_false);|' \
            "$KSUD"
          sed -i \
            's|extern struct static_key_false ksu_init_rc_hook_key_false;|struct static_key_false ksu_init_rc_hook_key_false = STATIC_KEY_FALSE_INIT;\nEXPORT_SYMBOL_GPL(ksu_init_rc_hook_key_false);|' \
            "$KSUD"

      # ---- ABK 外部模块（from 配置2） ----
      - name: Parse and clone ABK modules
        if: github.event.inputs.abk_modules != ''
        env:
          ABK_MODULES_INPUT: ${{ github.event.inputs.abk_modules }}
        run: |
          set -euo pipefail
          cd kernel_workspace
          MANIFEST="custom_external_modules.tsv"
          > "$MANIFEST"
          CACHE_DIR="/tmp/abk_cache_$$"
          mkdir -p "$CACHE_DIR"

          parse_and_clone() {
            local entry="$1"
            entry="$(echo "$entry" | xargs)"
            [ -z "$entry" ] && return 0
            if [[ "$entry" != *";"* ]]; then
              echo "::error::Module entry missing ';' : $entry"
              return 1
            fi
            local stage="${entry##*;}"
            local url_part="${entry%;*}"
            local kind="module"
            local group_url=""
            local child_id=""
            if [[ "$url_part" == module:* ]]; then
              url_part="${url_part#module:}"
            elif [[ "$url_part" == set:* ]]; then
              kind="set"
              local descriptor="${url_part#set:}"
              if [[ "$descriptor" != *"#"* ]]; then
                echo "::error::Set format missing child id: $entry"
                return 1
              fi
              group_url="${descriptor%%#*}"
              child_id="${descriptor#*#}"
              url_part="$group_url"
            fi
            local branch=""
            if [[ "$url_part" == *"#"* ]]; then
              branch="${url_part##*#}"
              url_part="${url_part%#*}"
            fi
            local repo_url="$url_part"
            local cache_key=$(echo "$repo_url#$branch" | md5sum | cut -d' ' -f1)
            local cached_repo="$CACHE_DIR/$cache_key"
            if [ -d "$cached_repo/.git" ]; then
              echo "Using cached repo: $cached_repo"
              cp -r "$cached_repo" "/tmp/module_$$_$cache_key"
            else
              echo "Cloning $repo_url ${branch:+(branch $branch)}"
              git clone --depth=1 ${branch:+-b "$branch"} "$repo_url" "$cached_repo" || return 1
              cp -r "$cached_repo" "/tmp/module_$$_$cache_key"
            fi
            local module_dir="/tmp/module_$$_$cache_key"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$stage" "$module_dir" "$repo_url" "$kind" "$group_url" "$child_id" >> "$MANIFEST"
          }

          IFS='|' read -ra entries <<< "$ABK_MODULES_INPUT"
          for entry in "${entries[@]}"; do
            parse_and_clone "$entry" || exit 1
          done
          echo "ABK_MANIFEST_PATH=$(pwd)/$MANIFEST" >> $GITHUB_ENV

      - name: Generate ABK flash dependencies
        if: github.event.inputs.abk_modules != ''
        env:
          ABK_MANIFEST: ${{ env.ABK_MANIFEST_PATH }}
        run: |
          cd kernel_workspace
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          manifest_path = Path(os.environ["ABK_MANIFEST"])
          if not manifest_path.exists() or manifest_path.stat().st_size == 0:
              exit(0)

          dependencies = []
          companion_apps = []
          seen_urls = set()
          seen_companion_urls = set()

          def parse_shell_conf(text):
              result = {}
              lines = text.splitlines()
              i = 0
              while i < len(lines):
                  line = lines[i].strip()
                  if not line or line.startswith('#'):
                      i += 1
                      continue
                  if '=' not in line:
                      i += 1
                      continue
                  key, value = line.split('=', 1)
                  key = key.strip()
                  value = value.strip()
                  if value in ('"', "'"):
                      quote = value
                      i += 1
                      collected = []
                      while i < len(lines) and lines[i].strip() != quote:
                          collected.append(lines[i])
                          i += 1
                      value = '\n'.join(collected)
                  else:
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
                          value = value[1:-1]
                  result[key] = value
                  i += 1
              return result

          def parse_module_set_items(text):
              items = []
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  parts = [p.strip() for p in line.split('|')]
                  if len(parts) < 4:
                      continue
                  items.append({
                      "id": parts[0],
                      "name": parts[1],
                      "description": parts[2],
                      "repo_url": parts[3],
                      "magisk_module_name": parts[10] if len(parts) > 10 else "",
                      "magisk_module_download_url": parts[11] if len(parts) > 11 else "",
                  })
              return items

          with open(manifest_path, 'r') as f:
              for line in f:
                  parts = line.strip().split('\t')
                  if len(parts) < 3:
                      continue
                  stage, module_dir, repo_url = parts[0], parts[1], parts[2]
                  kind = parts[3] if len(parts) > 3 else "module"
                  group_url = parts[4] if len(parts) > 4 else ""
                  child_id = parts[5] if len(parts) > 5 else ""

                  conf_path = Path(module_dir) / "module.conf"
                  if not conf_path.exists():
                      continue
                  conf = parse_shell_conf(conf_path.read_text(encoding='utf-8'))

                  dep_name = ""
                  dep_url = ""
                  source_name = conf.get("ABK_MODULE_NAME", "").strip()
                  source_id = conf.get("ABK_MODULE_ID", "").strip()

                  if kind == "set" and child_id:
                      items = parse_module_set_items(conf.get("ABK_MODULE_SET_ITEMS", ""))
                      child = next((it for it in items if it.get("id") == child_id), None)
                      if child:
                          dep_name = child.get("magisk_module_name", "").strip()
                          dep_url = child.get("magisk_module_download_url", "").strip()
                          source_name = child.get("name", "").strip() or source_name
                          source_id = child_id
                  else:
                      dep_name = conf.get("ABK_MAGISK_MODULE_NAME", "").strip()
                      dep_url = conf.get("ABK_MAGISK_MODULE_DOWNLOAD_URL", "").strip()

                  # Companion app
                  companion_pkg = conf.get("ABK_EXTENSION_COMPANION_PACKAGE", "").strip()
                  companion_name = conf.get("ABK_EXTENSION_COMPANION_DISPLAY_NAME", "").strip() or source_name
                  companion_asset = conf.get("ABK_EXTENSION_COMPANION_ASSET_NAME", "").strip()
                  companion_url = conf.get("ABK_EXTENSION_COMPANION_DOWNLOAD_URL", "").strip()
                  requires_companion = conf.get("ABK_EXTENSION_REQUIRES_COMPANION_APP", "").strip().lower() in {"1","y","yes","true","on"}
                  if requires_companion and companion_url:
                      key = companion_url.lower()
                      if key not in seen_companion_urls:
                          seen_companion_urls.add(key)
                          companion_apps.append({
                              "extensionId": conf.get("ABK_EXTENSION_ID", "").strip(),
                              "packageName": companion_pkg,
                              "displayName": companion_name,
                              "assetName": companion_asset,
                              "downloadUrl": companion_url,
                              "moduleId": source_id,
                              "moduleName": source_name,
                              "moduleRepoUrl": repo_url,
                          })

                  if not dep_url:
                      continue
                  key = dep_url.lower()
                  if key in seen_urls:
                      continue
                  seen_urls.add(key)
                  dependencies.append({
                      "id": source_id,
                      "name": dep_name or source_name or "magisk-module",
                      "downloadUrl": dep_url,
                      "moduleRepoUrl": repo_url,
                      "groupRepoUrl": group_url,
                      "childId": child_id,
                      "sourceName": source_name,
                  })

          output_path = Path("ABK_FLASH_DEPENDENCIES.json")
          if dependencies or companion_apps:
              output_path.write_text(
                  json.dumps({"schema": 2, "magiskModules": dependencies, "companionApps": companion_apps},
                             ensure_ascii=False, indent=2),
                  encoding='utf-8'
              )
              print(f"Generated dependencies: {len(dependencies)} modules, {len(companion_apps)} companions")
          elif output_path.exists():
              output_path.unlink()
          PY

      - name: Execute ABK modules (after_patch)
        if: github.event.inputs.abk_modules != ''
        env:
          ABK_MANIFEST: ${{ env.ABK_MANIFEST_PATH }}
          ABK_BUILD_ANDROID_VERSION: ${{ env.ANDROID_VERSION }}
          ABK_BUILD_KERNEL_VERSION: ${{ env.KERNEL_VERSION }}
          ABK_BUILD_KSU_VARIANT: "resukisu"   # 固定
          ABK_BUILD_VERSION: ${{ github.event.inputs.kernel_suffix }}
          ABK_FEATURE_SUSFS: ${{ github.event.inputs.SUSFS }}
          ABK_FEATURE_LZ4: ${{ github.event.inputs.lz4_opt }}
          ABK_FEATURE_BBR: ${{ github.event.inputs.bbr_enable }}
          ABK_FEATURE_DROIDSPACES: ${{ github.event.inputs.droidspaces_enable }}
          ABK_FEATURE_BETTER_NET: ${{ github.event.inputs.better_net }}
          ABK_FEATURE_ADIOS: ${{ github.event.inputs.adios_opt }}
          ABK_FEATURE_REKERNEL: ${{ github.event.inputs.rekernel_enable }}
          ABK_FEATURE_BBG: ${{ github.event.inputs.bbg_opt }}
        run: |
          set -euo pipefail
          cd kernel_workspace
          MANIFEST="$ABK_MANIFEST"
          [ ! -s "$MANIFEST" ] && exit 0
          STAGE="after_patch"
          while IFS=$'\t' read -r stage module_dir repo_url kind group_url child_id; do
            [ "$stage" = "$STAGE" ] || continue
            echo "Executing ABK module [$STAGE] $repo_url"
            if [ ! -f "$module_dir/setup.sh" ]; then
              echo "::warning::No setup.sh, skipping"
              continue
            fi
            chmod +x "$module_dir/setup.sh"
            (
              cd "$module_dir"
              export ABK_MODULE_ENTRY_KIND="$kind"
              export ABK_MODULE_GROUP_REPO_URL="$group_url"
              export ABK_MODULE_CHILD_ID="$child_id"
              export CUSTOM_EXTERNAL_MODULE_STAGE="$stage"
              export KERNEL_ROOT="$GITHUB_WORKSPACE/kernel_workspace"
              export DEFCONFIG="$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig"
              bash setup.sh
            ) || exit 1
          done < "$MANIFEST"

      # ---- 内核配置 ----
      - name: Configure Kernel Options
        run: |
          cd kernel_workspace
          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"

          # 基础
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFCONFIG"
          sed -i 's/check_defconfig//' ./common/build.config.gki
          echo "CONFIG_HEADERS_INSTALL=n" >> "$DEFCONFIG"
          echo "CONFIG_LLVM_POLLY=y" >> "$DEFCONFIG"
          echo "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> "$DEFCONFIG"

          # SUSFS
          if [ "${{ github.event.inputs.SUSFS }}" == "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$DEFCONFIG"
          fi

          # LZ4KD
          LZ4_OPT="${{ github.event.inputs.lz4_opt }}"
          if [ "$LZ4_OPT" = "lz4kd" ] || [ "$LZ4_OPT" = "both" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_842=y" >> "$DEFCONFIG"
          fi

          # Droidspaces
          DROID_MODE="${{ github.event.inputs.droidspaces_enable }}"
          if [ "$DROID_MODE" != "off" ]; then
            echo "CONFIG_PID_NS=y" >> "$DEFCONFIG"
            echo "CONFIG_IPC_NS=y" >> "$DEFCONFIG"
            echo "CONFIG_SYSVIPC=y" >> "$DEFCONFIG"
            echo "CONFIG_DEVTMPFS=y" >> "$DEFCONFIG"
            echo "CONFIG_NAMESPACES=y" >> "$DEFCONFIG"
            echo "CONFIG_POSIX_MQUEUE=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> "$DEFCONFIG"
            echo "CONFIG_NTSYNC=y" >> "$DEFCONFIG"   # standard 和 extend 均启用
            if [ "$DROID_MODE" = "extend" ]; then
              echo "CONFIG_BT_HCIVHCI=y" >> "$DEFCONFIG"
              echo "CONFIG_STATIC_USERMODEHELPER=n" >> "$DEFCONFIG"
              echo "CONFIG_DRM_LINDROID_EVDI=y" >> "$DEFCONFIG"
            fi
          fi

          # better_net
          if [ "${{ github.event.inputs.better_net }}" == "true" ]; then
            echo "CONFIG_BPF_STREAM_PARSER=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_SET=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_MAX=65534" >> "$DEFCONFIG"
            for opt in BITMAP_IP BITMAP_IPMAC BITMAP_PORT HASH_IP HASH_IPMARK HASH_IPPORT HASH_IPPORTIP HASH_IPPORTNET HASH_IPMAC HASH_MAC HASH_NETPORTNET HASH_NET HASH_NETNET HASH_NETPORT HASH_NETIFACE LIST_SET; do
              echo "CONFIG_IP_SET_${opt}=y" >> "$DEFCONFIG"
            done
            echo "CONFIG_IP6_NF_NAT=y" >> "$DEFCONFIG"
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_NF_TARGET_TTL=y" >> "$DEFCONFIG"
            echo "CONFIG_IP6_NF_TARGET_HL=y" >> "$DEFCONFIG"
            echo "CONFIG_IP6_NF_MATCH_HL=y" >> "$DEFCONFIG"
          fi

          # ADIOS (simple 或 full 都添加配置)
          ADIOS_OPT="${{ github.event.inputs.adios_opt }}"
          if [ "$ADIOS_OPT" != "off" ]; then
            echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> "$DEFCONFIG"
            echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> "$DEFCONFIG"
          fi

          # Re-Kernel
          if [ "${{ github.event.inputs.rekernel_enable }}" == "true" ]; then
            echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
          fi

          # Baseband Guard (bbg_opt)
          BBG_OPT="${{ github.event.inputs.bbg_opt }}"
          if [ "$BBG_OPT" != "off" ]; then
            echo "CONFIG_BBG=y" >> "$DEFCONFIG"
          fi

          # F2FS opt
          if [ "${{ github.event.inputs.f2fs_opt }}" == "true" ]; then
            echo "CONFIG_F2FS_FS=y" >> "$DEFCONFIG"
            echo "CONFIG_F2FS_STAT_FS=y" >> "$DEFCONFIG"
            echo "CONFIG_F2FS_FS_XATTR=y" >> "$DEFCONFIG"
            echo "CONFIG_F2FS_FS_POSIX_ACL=y" >> "$DEFCONFIG"
            echo "CONFIG_F2FS_FS_SECURITY=y" >> "$DEFCONFIG"
            echo "CONFIG_F2FS_FS_COMPRESSION=y" >> "$DEFCONFIG"
            echo "CONFIG_F2FS_FS_LZO=y" >> "$DEFCONFIG"
            echo "CONFIG_F2FS_FS_LZ4=y" >> "$DEFCONFIG"
            echo "CONFIG_F2FS_FS_ZSTD=y" >> "$DEFCONFIG"
          fi

          # WireGuard
          if [ "${{ github.event.inputs.wireguard }}" == "true" ]; then
            echo "CONFIG_WIREGUARD=y" >> "$DEFCONFIG"
          fi

          # Wakelock blocker
          if [ "${{ github.event.inputs.wakelock_blocker }}" == "true" ]; then
            echo "CONFIG_PM_WAKELOCKS=y" >> "$DEFCONFIG"
            echo "CONFIG_PM_WAKELOCKS_GC=y" >> "$DEFCONFIG"
            echo "CONFIG_PM_WAKELOCKS_LIMIT=100" >> "$DEFCONFIG"
          fi

          # BBR
          if [ "${{ github.event.inputs.bbr_enable }}" != "false" ]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG"
            echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
            echo "CONFIG_TCP_CONG_CUBIC=y" >> "$DEFCONFIG"
            echo "CONFIG_TCP_CONG_VEGAS=y" >> "$DEFCONFIG"
            echo "CONFIG_TCP_CONG_NV=y" >> "$DEFCONFIG"
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> "$DEFCONFIG"
            echo "CONFIG_TCP_CONG_HTCP=y" >> "$DEFCONFIG"
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> "$DEFCONFIG"
            echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG"
            echo "CONFIG_NET_SCH_FQ_CODEL=y" >> "$DEFCONFIG"
            if [ "${{ github.event.inputs.bbr_enable }}" == "default" ]; then
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> "$DEFCONFIG"
            else
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> "$DEFCONFIG"
            fi
          fi

          # LTO
          LTO="${{ github.event.inputs.lto_type }}"
          if [ "$LTO" == "none" ]; then
            echo "CONFIG_LTO_CLANG_NONE=y" >> "$DEFCONFIG"
          elif [ "$LTO" == "full" ]; then
            echo "CONFIG_LTO_CLANG_FULL=y" >> "$DEFCONFIG"
          else
            echo "CONFIG_LTO_CLANG_THIN=y" >> "$DEFCONFIG"
          fi

          # SchedUtil
          if [ "${{ github.event.inputs.schedutil_opt }}" == "true" ]; then
            echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> "$DEFCONFIG"
            echo "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" >> "$DEFCONFIG"
          fi

          # ZRAM writeback
          if [ "${{ github.event.inputs.zram_writeback }}" == "true" ]; then
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$DEFCONFIG"
            echo "CONFIG_ZRAM_MEMORY_TRACKING=y" >> "$DEFCONFIG"
          fi

          # CPU optimizations
          if [ "${{ github.event.inputs.cpu_opt }}" == "true" ]; then
            echo "CONFIG_ARM64_ERRATUM_2658417=y" >> "$DEFCONFIG"
            echo "CONFIG_ARCH_QCOM=y" >> "$DEFCONFIG"
            echo "CONFIG_HZ_300=y" >> "$DEFCONFIG"
            echo "CONFIG_PREEMPT=y" >> "$DEFCONFIG"
            echo "CONFIG_NO_HZ_IDLE=y" >> "$DEFCONFIG"
          fi

          # SCX
          if [ "${{ github.event.inputs.enable_scx }}" == "true" ]; then
            echo "CONFIG_SCHED_CLASS_EXT=y" >> "$DEFCONFIG"
            echo "CONFIG_OPLUS_FEATURE_HMBIRD_BOOST=y" >> "$DEFCONFIG"
            echo "CONFIG_OPLUS_FEATURE_HMBIRD_SCHED=y" >> "$DEFCONFIG"
          fi

          echo "Defconfig updated."

      # ---- Baseband Guard 安装（根据 bbg_opt） ----
      - name: Apply Baseband Guard
        if: github.event.inputs.bbg_opt != 'off'
        run: |
          cd kernel_workspace/common
          if [ "${{ github.event.inputs.bbg_opt }}" == "vc-teahouse" ]; then
            curl -sSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          else
            curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          fi
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      # ---- 自定义内核后缀（从 inputs.kernel_suffix） ----
      - name: Set kernel suffix
        run: |
          cd kernel_workspace
          SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          if [ -z "$SUFFIX" ]; then
            SUFFIX="${{ env.KERNEL_NAME }}"
          fi
          echo "FINAL_SUFFIX=${SUFFIX}" >> $GITHUB_ENV
          SCRIPT="./common/scripts/setlocalversion"
          if [ -f "$SCRIPT" ]; then
            sed -i 's/ -dirty//g' "$SCRIPT"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$SCRIPT"
            if grep -q 'KERNELVERSION.*scm_version' "$SCRIPT"; then
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${SUFFIX}\"|" "$SCRIPT"
            elif grep -q 'echo "\$res"' "$SCRIPT"; then
              sed -i "0,/echo \"\$res\"/s//echo \"-${SUFFIX}\"/" "$SCRIPT"
            else
              echo "echo \"-${SUFFIX}\"" >> "$SCRIPT"
            fi
            chmod +x "$SCRIPT"
          fi
          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            grep -v '^CONFIG_LOCALVERSION=' "$DEFCONFIG" > "$DEFCONFIG.tmp"
            echo "CONFIG_LOCALVERSION=\"-${SUFFIX}\"" >> "$DEFCONFIG.tmp"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG.tmp"
            mv "$DEFCONFIG.tmp" "$DEFCONFIG"
            sed -i "s/-4k/-${SUFFIX}/g" "$DEFCONFIG"
          fi

      # ---- 执行 ABK before_build ----
      - name: Execute ABK modules (before_build)
        if: github.event.inputs.abk_modules != ''
        env:
          ABK_MANIFEST: ${{ env.ABK_MANIFEST_PATH }}
          ABK_BUILD_ANDROID_VERSION: ${{ env.ANDROID_VERSION }}
          ABK_BUILD_KERNEL_VERSION: ${{ env.KERNEL_VERSION }}
          ABK_BUILD_KSU_VARIANT: "resukisu"
          ABK_BUILD_VERSION: ${{ github.event.inputs.kernel_suffix }}
          ABK_FEATURE_SUSFS: ${{ github.event.inputs.SUSFS }}
          ABK_FEATURE_LZ4: ${{ github.event.inputs.lz4_opt }}
          ABK_FEATURE_BBR: ${{ github.event.inputs.bbr_enable }}
          ABK_FEATURE_DROIDSPACES: ${{ github.event.inputs.droidspaces_enable }}
          ABK_FEATURE_BETTER_NET: ${{ github.event.inputs.better_net }}
          ABK_FEATURE_ADIOS: ${{ github.event.inputs.adios_opt }}
          ABK_FEATURE_REKERNEL: ${{ github.event.inputs.rekernel_enable }}
          ABK_FEATURE_BBG: ${{ github.event.inputs.bbg_opt }}
        run: |
          set -euo pipefail
          cd kernel_workspace
          MANIFEST="$ABK_MANIFEST"
          [ ! -s "$MANIFEST" ] && exit 0
          STAGE="before_build"
          while IFS=$'\t' read -r stage module_dir repo_url kind group_url child_id; do
            [ "$stage" = "$STAGE" ] || continue
            echo "Executing ABK module [$STAGE] $repo_url"
            if [ ! -f "$module_dir/setup.sh" ]; then
              echo "::warning::No setup.sh, skipping"
              continue
            fi
            chmod +x "$module_dir/setup.sh"
            (
              cd "$module_dir"
              export ABK_MODULE_ENTRY_KIND="$kind"
              export ABK_MODULE_GROUP_REPO_URL="$group_url"
              export ABK_MODULE_CHILD_ID="$child_id"
              export CUSTOM_EXTERNAL_MODULE_STAGE="$stage"
              export KERNEL_ROOT="$GITHUB_WORKSPACE/kernel_workspace"
              export DEFCONFIG="$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig"
              bash setup.sh
            ) || exit 1
          done < "$MANIFEST"

      # ---- 构建内核（带时间劫持） ----
      - name: Build Kernel
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang-r563880c/bin:$WORKDIR/kernel_workspace/build-tools/linux-x86/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang-r563880c/bin"
          echo "Clang: $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD:   $($CLANG_DIR/ld.lld --version | head -n 1)"
          pahole --version 2>/dev/null || echo "Pahole: Not Installed"

          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_IS_KERNEL_COMPILING=true

          mkdir -p /dev/shm/kout
          mkdir -p /dev/shm/ldcache_6.6.139

          cd kernel_workspace/common

          # 时间劫持 wrapper
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so 2>/dev/null || true
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so 2>/dev/null || true
          chmod 777 ./*.so 2>/dev/null || true
          SO_DIR=$(pwd)
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"

          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper

          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@" --thinlto-cache-dir=/dev/shm/ldcache_6.6.139 --thinlto-jobs=$(($(nproc --all) / 2))' >> ld-wrapper
          chmod +x cc-wrapper ld-wrapper

          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" \
            O=/dev/shm/kout \
            KCFLAGS="-O2 -pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-default-const-init-var-unsafe -Wno-format -Wno-unknown-warning-option ${EXTRA_CFLAGS:-} ${MAP:-}" \
            gki_defconfig

          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" \
            O=/dev/shm/kout \
            KCFLAGS="-O2 -pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-default-const-init-var-unsafe -Wno-format -Wno-unknown-warning-option ${EXTRA_CFLAGS:-} ${MAP:-}" \
            Image

          echo "Kernel Compilation Complete!"
          ccache -c
          ccache --evict-older-than 10800s
          ccache -s
          df -h

      # ---- 保存 CCache 和 LTO 缓存 ----
      - name: Save New CCache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save LTO CCache
        if: success() && inputs.lto_type == 'thin'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: lto-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # ---- 打包 AK3 ----
      - name: Package AK3 ZIP
        id: create_zip
        run: |
          cd kernel_workspace
          git clone https://github.com/palazik/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp /dev/shm/kout/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "Kernel Image not found, build may have failed."
            exit 1
          fi

          KSU_TYPENAME="ReSukiSU"
          SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$SUFFIX" ] && SUFFIX="${{ env.KERNEL_NAME }}"
          AK3_NAME="AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${SUFFIX}.zip"
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT

          # 日志
          FULL_VERSION="${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${SUFFIX}"
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${{ env.KSUVER }}" >> ./ak3.log
          echo "SuSFS: ${{ github.event.inputs.SUSFS }}" >> ./ak3.log
          echo "LZ4: ${{ github.event.inputs.lz4_opt }}" >> ./ak3.log
          echo "BBR: ${{ github.event.inputs.bbr_enable }}" >> ./ak3.log
          echo "ADIOS: ${{ github.event.inputs.adios_opt }}" >> ./ak3.log
          echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}" >> ./ak3.log
          echo "BBG: ${{ github.event.inputs.bbg_opt }}" >> ./ak3.log
          echo "Droidspaces: ${{ github.event.inputs.droidspaces_enable }}" >> ./ak3.log
          echo "Better_Net: ${{ github.event.inputs.better_net }}" >> ./ak3.log
          echo "MemOpt: ${{ github.event.inputs.mem_opt_patches }}" >> ./ak3.log
          echo "SCX: ${{ github.event.inputs.enable_scx }}" >> ./ak3.log
          zip -z ../$AK3_NAME < ./ak3.log

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false

      - name: Upload ZRAM module (if built)
        run: |
          ZRAM_KO=$(find /dev/shm/kout -name "zram.ko" | head -1)
          if [ -n "$ZRAM_KO" ]; then
            curl -L "https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/zram.zip" -o zram.zip
            unzip -q zram.zip -d zram
            find zram -name "zram.ko" -exec cp "$ZRAM_KO" {} \;
            rm -f zram.zip
          fi

      - name: Upload zram.zip (if exists)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: zram-module
          path: ./zram/*

      # ---- Telegram 通知（保留原有） ----
      - name: Send Telegram Notification (Success)
        if: success()
        env:
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M:%S %Z")
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-8)
          COMMIT_MSG="Workflow Dispatch: 6.6.139"
          REPO_URL="https://github.com/${{ github.repository }}"
          RUN_URL="$REPO_URL/actions/runs/${{ github.run_id }}"
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"

          export TG_KERNEL_VERSION="6.6.139"
          export TG_KSU_DISPLAY="ReSukiSU"
          export TG_KSUVER="${{ env.KSUVER }}"
          export TG_SUFFIX="${{ env.FINAL_SUFFIX }}"
          export TG_LTO="${{ github.event.inputs.lto_type }}"
          export TG_BUILD_NUM="${{ github.run_number }}"
          export TG_TIME_NOW="$TIME_NOW"
          export TG_RUN_URL="$RUN_URL"
          export TG_REPO="${{ github.repository }}"
          export TG_SUSFS="${{ github.event.inputs.SUSFS }}"
          export TG_BBR="${{ github.event.inputs.bbr_enable }}"
          export TG_ADIOS="${{ github.event.inputs.adios_opt }}"
          export TG_BBG="${{ github.event.inputs.bbg_opt }}"
          export TG_LZ4="${{ github.event.inputs.lz4_opt }}"
          export TG_MM="true"
          export TG_SCX="${{ github.event.inputs.enable_scx }}"
          export TG_UFIX="${{ github.event.inputs.unicode_fix }}"
          export TG_ZWB="${{ github.event.inputs.zram_writeback }}"
          export TG_SCHED="${{ github.event.inputs.schedutil_opt }}"
          export TG_CLANG="AOSP Clang-r563880c"
          export TG_CPU_OPT="${{ github.event.inputs.cpu_opt }}"
          export TG_F2FS="${{ github.event.inputs.f2fs_opt }}"
          export TG_WG="${{ github.event.inputs.wireguard }}"
          export TG_WLB="${{ github.event.inputs.wakelock_blocker }}"
          export TG_DROIDSPACES="${{ github.event.inputs.droidspaces_enable }}"
          export TG_BETTER_NET="${{ github.event.inputs.better_net }}"
          export TG_MEM_OPT="${{ github.event.inputs.mem_opt_patches }}"

          TELEGRAPH_URL=$(python3 << 'PYEOF'
          import json, urllib.request, urllib.parse, os
          e = os.environ.get
          def feat(val, name):
              icon = "✅" if val == "true" or (val not in ['false','off','none']) else "❌"
              return {"tag": "li", "children": [f"{icon} {name}"]}
          content = [
              {"tag": "h3", "children": ["OnePlus 13 (PJZ110) — Enhanced Kernel"]},
              {"tag": "hr"},
              {"tag": "h4", "children": ["📋 Build Info"]},
              {"tag": "ul", "children": [
                  {"tag": "li", "children": [{"tag": "strong", "children": ["Device: "]}, "OnePlus 13 PJZ110 (CN) / SM8750"]},
                  {"tag": "li", "children": [{"tag": "strong", "children": ["Kernel: "]}, f"{e('TG_KERNEL_VERSION')}-android15"]},
                  {"tag": "li", "children": [{"tag": "strong", "children": ["Manager: "]}, f"{e('TG_KSU_DISPLAY')} v{e('TG_KSUVER')}"]},
                  {"tag": "li", "children": [{"tag": "strong", "children": ["Suffix: "]}, f"-{e('TG_SUFFIX')}"]},
                  {"tag": "li", "children": [{"tag": "strong", "children": ["LTO: "]}, e("TG_LTO")]},
                  {"tag": "li", "children": [{"tag": "strong", "children": ["Clang: "]}, e("TG_CLANG")]},
                  {"tag": "li", "children": [{"tag": "strong", "children": ["Build #: "]}, e("TG_BUILD_NUM")]},
                  {"tag": "li", "children": [{"tag": "strong", "children": ["Time: "]}, e("TG_TIME_NOW")]}
              ]},
              {"tag": "hr"},
              {"tag": "h4", "children": ["⚡ Features"]},
              {"tag": "ul", "children": [
                  feat(e("TG_SUSFS"),   "SuSFS"),
                  feat(e("TG_BBR")!="false" and "BBR/Brutal" or "BBR off", "BBR/Brutal"),
                  feat(e("TG_ADIOS")!="off" and f"ADIOS ({e('TG_ADIOS')})" or "ADIOS off", "ADIOS"),
                  feat(e("TG_BBG")!="off" and f"Baseband Guard ({e('TG_BBG')})" or "BBG off", "BBG"),
                  feat(e("TG_LZ4")!="none" and f"LZ4: {e('TG_LZ4')}" or "LZ4 off", "LZ4"),
                  feat("true", "Multi-Manager"),
                  feat(e("TG_SCX"), "SCX/Fengchi"),
                  feat(e("TG_UFIX"), "Unicode Fix"),
                  feat(e("TG_ZWB"), "ZRAM Writeback"),
                  feat(e("TG_SCHED"), "SchedUtil"),
                  feat(e("TG_CPU_OPT"), "Oryon CPU"),
                  feat(e("TG_F2FS"), "F2FS"),
                  feat(e("TG_WG"), "WireGuard"),
                  feat(e("TG_WLB"), "Wakelock Blocker"),
                  feat(e("TG_DROIDSPACES")!="off" and f"Droidspaces ({e('TG_DROIDSPACES')})" or "Droidspaces off", "Droidspaces"),
                  feat(e("TG_BETTER_NET"), "Better Net"),
                  feat(e("TG_MEM_OPT"), "Mem/Sched Opt"),
              ]},
              {"tag": "hr"},
              {"tag": "h4", "children": ["📥 Installation"]},
              {"tag": "ol", "children": [
                  {"tag": "li", "children": ["Flash AnyKernel3 zip via TWRP or KernelFlasher"]},
                  {"tag": "li", "children": ["Install metamodule: mountify / meta-overlayfs / meta-magicmount"]},
                  {"tag": "li", "children": ["I'm not responsible for bricked devices / losen data or other things"]},
              ]},
              {"tag": "hr"},
              {"tag": "p", "children": [
                  {"tag": "a", "attrs": {"href": e("TG_RUN_URL")}, "children": ["🔗 GitHub Actions Run"]},
                  "  |  ",
                  {"tag": "a", "attrs": {"href": f"https://github.com/{e('TG_REPO')}"}, "children": [f"📦 {e('TG_REPO')}"]},
              ]},
              {"tag": "p", "children": ["Built by @palaziks"]},
          ]
          data = {
              "access_token": os.environ.get("TELEGRAPH_TOKEN", ""),
              "title": f"palaziks kernel — OP13 {e('TG_KERNEL_VERSION')}-{e('TG_SUFFIX')} #{e('TG_BUILD_NUM')}",
              "author_name": "palaziks",
              "author_url": f"https://github.com/{e('TG_REPO')}",
              "content": json.dumps(content),
              "return_content": "false"
          }
          req = urllib.request.Request(
              "https://api.telegra.ph/createPage",
              data=urllib.parse.urlencode(data).encode(),
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  result = json.load(resp)
                  if result.get("ok"):
                      print(result["result"]["url"])
                  else:
                      print("")
          except Exception:
              print("")
          PYEOF
          )

          CAPTION="✅ <b>Kernel Build Successful!</b>

          📱 <b>Device:</b> <code>OnePlus 13</code>
          ⚡ <b>KSU:</b> <code>ReSukiSU</code>
          📅 <b>Date:</b> $DATE
          📝 <b>Commit:</b> <code>$COMMIT_MSG</code>
          🔢 <b>Hash:</b> <a href=\"$REPO_URL/commit/${{ github.sha }}\">$COMMIT_HASH</a>
          🔧 <b>Kernel features:</b> <a href=\"$TELEGRAPH_URL\">click to read</a>"

          ZIP_PATH=$(ls ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document="@$ZIP_PATH" \
            -F caption="$CAPTION" \
            -F parse_mode="HTML"

      - name: Send Telegram Notification (Failure)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M:%S %Z")
          REPO_URL="https://github.com/${{ github.repository }}"
          CAPTION="❌ <b>Kernel Build Failed!</b>

          📱 <b>Device:</b> <code>OnePlus 13</code>
          ⚡ <b>KSU:</b> <code>ReSukiSU</code>
          📅 <b>Date:</b> $DATE
          📝 <b>Commit:</b> <code>$COMMIT_MSG</code>
          🔢 <b>Hash:</b> <a href=\"$REPO_URL/commit/${{ github.sha }}\">$(echo "${{ github.sha }}" | cut -c1-8)</a>"
          
          if [ -f /tmp/kbuild.log ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F document="@/tmp/kbuild.log" \
              -F caption="$CAPTION" \
              -F parse_mode="HTML"
          else
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="$CAPTION" \
              -d parse_mode="HTML"
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
      
    steps:
      - name: Download ZIP Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: Set Environment Variables
        run: |
          SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$SUFFIX" ] && SUFFIX="${{ env.KERNEL_NAME }}"
          FULL_VERSION="${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${SUFFIX}"
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          TAG_HEAD="OPPO-OPlus-Realme-build"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV

      - name: Create Release
        if: ${{ github.event.inputs.github_release == 'true' }}
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 OnePlus 13 ReSukiSU SM8750 Custom Kernel (Enhanced)
          - **Kernel Version:** ${{ env.FULL_VERSION }}
          - **Build Time:** ${{ env.TIME_FORM }}
          - **KSU Branch:** ReSukiSU
          - **Features:**
            - SuSFS: ${{ github.event.inputs.SUSFS }}
            - LZ4/ZSTD: ${{ github.event.inputs.lz4_opt }}
            - BBR/Brutal: ${{ github.event.inputs.bbr_enable }}
            - ADIOS: ${{ github.event.inputs.adios_opt }}
            - Re-Kernel: ${{ github.event.inputs.rekernel_enable }}
            - Baseband Guard: ${{ github.event.inputs.bbg_opt }}
            - Droidspaces: ${{ github.event.inputs.droidspaces_enable }}
            - Better Net: ${{ github.event.inputs.better_net }}
            - Unicode Fix: ${{ github.event.inputs.unicode_fix }}
            - Memory/Sched Opt: ${{ github.event.inputs.mem_opt_patches }}
            - SCX/Fengchi: ${{ github.event.inputs.enable_scx }}
          - **Multi-Manager:** true
          - **Tested on:** OnePlus 13 (crDroid etc.)
          - **Installation:** Flash AnyKernel3 zip via TWRP/KernelFlasher; install a metamodule (mountify, meta-overlayfs, etc.) for proper module mounting.
          - **Warning:** Always backup boot partition before flashing. I am not responsible for any damage.
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
